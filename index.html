<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="music-player">

    <h1>Music Player</h1>

    <img 
      src="tedy.jpg.png"
      alt="Teddy Movie"
      class="song-image"
    >

    <h2 id="song-title">Ee Bandhame Bandhamo</h2>

    <p id="artist-name">Vijay Yesudas</p>

    <!-- Audio -->

    <audio id="audio" controls>
      <source src="./song.mp3" type="audio/mp3">
    </audio>

    <!-- Progress Bar -->

    <input type="range" id="progress" value="0">

    <!-- Controls -->

    <div class="controls">

      <button onclick="previousSong()">⏮</button>

      <button id="play-btn" onclick="playPauseSong()">▶</button>

      <button onclick="nextSong()">⏭</button>

    </div>

    <!-- Volume Control -->

    <div class="volume-section">

      <label>Volume</label>

      <input 
        type="range" 
        id="volume" 
        min="0" 
        max="1" 
        step="0.1" 
        value="1"
      >

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
